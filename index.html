<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dwNutriTrack</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid font-bold text-emerald-400 text-xl fa-utensils"></i>
                <h1 class="text-xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">dwNutriTrack</h1>
            </div>
            <button onclick="toggleConfigModal()" class="text-slate-400 hover:text-slate-200 transition p-2 rounded-lg hover:bg-slate-700">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-6 space-y-8">

        <!-- Datumsauswahl -->
        <div class="bg-slate-800 rounded-2xl p-4 shadow-lg border border-slate-700 flex justify-between items-center">
            <button onclick="changeDate(-1)" class="p-2 text-slate-400 hover:text-white hover:bg-slate-700 rounded-lg transition">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <input type="date" id="selectedDate" onchange="loadDayData()" class="bg-slate-900 text-emerald-400 font-semibold px-3 py-1.5 rounded-xl border border-slate-700 focus:outline-none text-center">
            <button onclick="changeDate(1)" class="p-2 text-slate-400 hover:text-white hover:bg-slate-700 rounded-lg transition">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <!-- Tagesübersicht / Stats -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-slate-800 rounded-2xl p-4 shadow-lg border border-slate-700 flex flex-col justify-between">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Flüssigkeit</span>
                    <i class="fa-solid fa-glass-water text-cyan-400"></i>
                </div>
                <div class="flex items-baseline space-x-1">
                    <span id="totalWater" class="text-2xl font-extrabold text-cyan-400">0</span>
                    <span class="text-xs text-slate-400">ml</span>
                </div>
            </div>
            <div class="bg-slate-800 rounded-2xl p-4 shadow-lg border border-slate-700 flex flex-col justify-between">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Mahlzeiten</span>
                    <i class="fa-solid fa-bowl-food text-emerald-400"></i>
                </div>
                <div class="flex items-baseline space-x-1">
                    <span id="totalMeals" class="text-2xl font-extrabold text-emerald-400">0</span>
                    <span class="text-xs text-slate-400">Einträge</span>
                </div>
            </div>
        </div>

        <!-- SEKTION TRINKEN -->
        <section class="bg-slate-800 rounded-2xl p-5 shadow-lg border border-slate-700 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-bottle-water text-cyan-400"></i> Trinken Schnellerfassung
                </h2>
                <button onclick="toggleManageWater()" id="btnManageWater" class="text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded-lg text-slate-300 transition">
                    Verwalten
                </button>
            </div>

            <!-- Kacheln Trinken -->
            <div id="waterTiles" class="grid grid-cols-2 sm:grid-cols-4 gap-2"></div>

            <!-- Manuelle Trinken-Eingabe -->
            <div class="pt-2 flex gap-2">
                <input type="text" id="customWaterType" placeholder="Getränk (z.B. Tee)" class="w-1/2 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-cyan-500">
                <input type="number" id="customWaterAmount" placeholder="ml" class="w-1/4 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-cyan-500">
                <button onclick="addCustomWater()" class="w-1/4 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold rounded-xl text-sm transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
        </section>

        <!-- SEKTION ESSEN SCHNELLERFASSUNG -->
        <section class="bg-slate-800 rounded-2xl p-5 shadow-lg border border-slate-700 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-bolt text-emerald-400"></i> Essen Schnellerfassung
                </h2>
                <button onclick="toggleManageFood()" id="btnManageFood" class="text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded-lg text-slate-300 transition">
                    Verwalten
                </button>
            </div>

            <!-- Kacheln Essen -->
            <div id="foodTiles" class="grid grid-cols-2 sm:grid-cols-4 gap-2"></div>

            <!-- Neue Essen-Kachel erstellen -->
            <div class="pt-2 flex gap-2">
                <input type="text" id="newFoodName" placeholder="Kachel Name (z.B. Apfel)" class="w-1/2 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                <select id="newFoodCategory" class="w-1/3 bg-slate-900 border border-slate-700 rounded-xl px-2 py-2 text-sm focus:outline-none focus:border-emerald-500">
                    <option value="morgens">Morgens</option>
                    <option value="mittags">Mittags</option>
                    <option value="abends">Abends</option>
                    <option value="snacks" selected>Snack</option>
                </select>
                <button onclick="addCustomFoodTile()" class="w-1/6 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl text-sm transition flex items-center justify-center">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
        </section>

        <!-- SEKTION ESSEN MANUELL -->
        <section class="bg-slate-800 rounded-2xl p-5 shadow-lg border border-slate-700 space-y-4">
            <h2 class="text-lg font-semibold flex items-center gap-2">
                <i class="fa-solid fa-utensils text-emerald-400"></i> Mahlzeit eintragen
            </h2>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                <button onclick="selectMealType('morgens')" id="btn-morgens" class="meal-type-btn p-2.5 rounded-xl border border-slate-700 bg-slate-900 text-xs font-semibold text-slate-300 hover:border-emerald-500 transition">
                    <i class="fa-solid fa-sun text-amber-400 block mb-1 text-sm"></i> Morgens
                </button>
                <button onclick="selectMealType('mittags')" id="btn-mittags" class="meal-type-btn p-2.5 rounded-xl border border-slate-700 bg-slate-900 text-xs font-semibold text-slate-300 hover:border-emerald-500 transition">
                    <i class="fa-solid fa-cloud-sun text-orange-400 block mb-1 text-sm"></i> Mittags
                </button>
                <button onclick="selectMealType('abends')" id="btn-abends" class="meal-type-btn p-2.5 rounded-xl border border-slate-700 bg-slate-900 text-xs font-semibold text-slate-300 hover:border-emerald-500 transition">
                    <i class="fa-solid fa-moon text-indigo-400 block mb-1 text-sm"></i> Abends
                </button>
                <button onclick="selectMealType('snacks')" id="btn-snacks" class="meal-type-btn p-2.5 rounded-xl border border-slate-700 bg-slate-900 text-xs font-semibold text-slate-300 hover:border-emerald-500 transition">
                    <i class="fa-solid fa-cookie-bite text-pink-400 block mb-1 text-sm"></i> Snacks
                </button>
            </div>
            <div class="flex gap-2">
                <input type="text" id="foodDescription" placeholder="Was hast du gegessen?" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
                <button onclick="addFoodLog()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-5 py-2.5 rounded-xl transition text-sm">
                    Speichern
                </button>
            </div>
        </section>

        <!-- TAGELOG / PROTOKOLL -->
        <section class="bg-slate-800 rounded-2xl p-5 shadow-lg border border-slate-700 space-y-4">
            <h2 class="text-lg font-semibold">Tagesprotokoll</h2>
            <div id="logList" class="space-y-2 text-sm">
                <!-- Dynamische Einträge -->
            </div>
        </section>

        <!-- CHART / VERLAUF -->
        <section class="bg-slate-800 rounded-2xl p-5 shadow-lg border border-slate-700 space-y-4">
            <h2 class="text-lg font-semibold">Wasserverlauf (Heute)</h2>
            <div class="w-full h-48">
                <canvas id="waterChart"></canvas>
            </div>
        </section>
    </main>

    <!-- CONFIG MODAL -->
    <div id="configModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 rounded-2xl max-w-md w-full p-6 border border-slate-700 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold">Supabase Konfiguration</h3>
                <button onclick="toggleConfigModal()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <p class="text-xs text-slate-400">Trage hier deine Supabase Zugangsdaten aus deinen Projekt-Einstellungen ein.</p>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300">Project URL</label>
                    <input type="text" id="cfgUrl" placeholder="https://xxx.supabase.co" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300">Anon Key</label>
                    <input type="password" id="cfgKey" placeholder="eyJhbGci..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="saveConfig()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-xl font-semibold text-sm transition">
                    Speichern & Verbinden
                </button>
            </div>
        </div>
    </div>

    <script>
        // Standard-Kacheln Trinken
        const defaultWaterTiles = [
            { id: 'w1', name: 'Wasser', amount: 250, icon: 'fa-glass-water' },
            { id: 'w2', name: 'Wasser Groß', amount: 500, icon: 'fa-bottle-water' },
            { id: 'w3', name: 'Kaffee', amount: 150, icon: 'fa-mug-hot' },
            { id: 'w4', name: 'Tee', amount: 200, icon: 'fa-cup-toting' }
        ];

        // Standard-Kacheln Essen
        const defaultFoodTiles = [
            { id: 'f1', name: 'Apfel', category: 'snacks' },
            { id: 'f2', name: 'Banane', category: 'snacks' },
            { id: 'f3', name: 'Brötchen', category: 'morgens' },
            { id: 'f4', name: 'Salat', category: 'mittags' },
            { id: 'f5', name: 'Schokolade', category: 'snacks' },
            { id: 'f6', name: 'Nüsse', category: 'snacks' }
        ];

        let waterTilesData = JSON.parse(localStorage.getItem('dw_water_tiles')) || defaultWaterTiles;
        let foodTilesData = JSON.parse(localStorage.getItem('dw_food_tiles')) || defaultFoodTiles;

        let isManageWater = false;
        let isManageFood = false;

        let selectedMeal = 'morgens';
        let supabaseClient = null;
        let waterChart = null;

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('selectedDate').valueAsDate = new Date();
            initSupabase();
            renderWaterTiles();
            renderFoodTiles();
            selectMealType('morgens');
            initChart();
            loadDayData();
        });

        function initSupabase() {
            const url = localStorage.getItem('dw_supabase_url');
            const key = localStorage.getItem('dw_supabase_key');
            
            if (url && key) {
                document.getElementById('cfgUrl').value = url;
                document.getElementById('cfgKey').value = key;
                supabaseClient = supabase.createClient(url, key);
            } else {
                toggleConfigModal();
            }
        }

        function saveConfig() {
            const url = document.getElementById('cfgUrl').value.trim();
            const key = document.getElementById('cfgKey').value.trim();
            
            if (url && key) {
                localStorage.setItem('dw_supabase_url', url);
                localStorage.setItem('dw_supabase_key', key);
                supabaseClient = supabase.createClient(url, key);
                toggleConfigModal();
                loadDayData();
            }
        }

        function toggleConfigModal() {
            document.getElementById('configModal').classList.toggle('hidden');
        }

        // Datum Navigation
        function changeDate(days) {
            const dateInput = document.getElementById('selectedDate');
            const currentDate = new Date(dateInput.value);
            currentDate.setDate(currentDate.getDate() + days);
            dateInput.valueAsDate = currentDate;
            loadDayData();
        }

        // KACHELN TRINKEN
        function renderWaterTiles() {
            const container = document.getElementById('waterTiles');
            container.innerHTML = '';

            waterTilesData.forEach(tile => {
                const div = document.createElement('div');
                div.className = 'relative group';
                div.innerHTML = `
                    <button onclick="logWater('${tile.name}', ${tile.amount})" class="w-full bg-slate-900 border border-slate-700 hover:border-cyan-500 p-2.5 rounded-xl text-center transition flex flex-col items-center">
                        <i class="fa-solid ${tile.icon || 'fa-glass-water'} text-cyan-400 mb-1"></i>
                        <span class="text-xs font-semibold">${tile.name}</span>
                        <span class="text-[10px] text-slate-400">${tile.amount} ml</span>
                    </button>
                    ${isManageWater ? `
                        <button onclick="deleteWaterTile('${tile.id}')" class="absolute -top-2 -right-2 bg-red-500 hover:bg-red-600 text-white rounded-full w-5 h-5 text-xs flex items-center justify-center shadow-md">
                            &times;
                        </button>
                    ` : ''}
                `;
                container.appendChild(div);
            });
        }

        function toggleManageWater() {
            isManageWater = !isManageWater;
            document.getElementById('btnManageWater').textContent = isManageWater ? 'Fertig' : 'Verwalten';
            renderWaterTiles();
        }

        function deleteWaterTile(id) {
            waterTilesData = waterTilesData.filter(t => t.id !== id);
            localStorage.setItem('dw_water_tiles', JSON.stringify(waterTilesData));
            renderWaterTiles();
        }

        function addCustomWater() {
            const type = document.getElementById('customWaterType').value.trim() || 'Wasser';
            const amount = parseInt(document.getElementById('customWaterAmount').value);
            if (amount > 0) {
                logWater(type, amount);
                document.getElementById('customWaterAmount').value = '';
            }
        }

        // KACHELN ESSEN
        function renderFoodTiles() {
            const container = document.getElementById('foodTiles');
            container.innerHTML = '';

            foodTilesData.forEach(tile => {
                const div = document.createElement('div');
                div.className = 'relative group';
                div.innerHTML = `
                    <button onclick="logFoodQuick('${tile.name}', '${tile.category}')" class="w-full bg-slate-900 border border-slate-700 hover:border-emerald-500 p-2.5 rounded-xl text-center transition flex flex-col items-center">
                        <i class="fa-solid fa-utensils text-emerald-400 mb-1"></i>
                        <span class="text-xs font-semibold truncate w-full">${tile.name}</span>
                        <span class="text-[10px] text-slate-400 capitalize">${tile.category}</span>
                    </button>
                    ${isManageFood ? `
                        <button onclick="deleteFoodTile('${tile.id}')" class="absolute -top-2 -right-2 bg-red-500 hover:bg-red-600 text-white rounded-full w-5 h-5 text-xs flex items-center justify-center shadow-md">
                            &times;
                        </button>
                    ` : ''}
                `;
                container.appendChild(div);
            });
        }

        function toggleManageFood() {
            isManageFood = !isManageFood;
            document.getElementById('btnManageFood').textContent = isManageFood ? 'Fertig' : 'Verwalten';
            renderFoodTiles();
        }

        function deleteFoodTile(id) {
            foodTilesData = foodTilesData.filter(t => t.id !== id);
            localStorage.setItem('dw_food_tiles', JSON.stringify(foodTilesData));
            renderFoodTiles();
        }

        function addCustomFoodTile() {
            const name = document.getElementById('newFoodName').value.trim();
            const category = document.getElementById('newFoodCategory').value;
            if (name) {
                const newTile = {
                    id: 'f_' + Date.now(),
                    name: name,
                    category: category
                };
                foodTilesData.push(newTile);
                localStorage.setItem('dw_food_tiles', JSON.stringify(foodTilesData));
                document.getElementById('newFoodName').value = '';
                renderFoodTiles();
            }
        }

        // MANUELLE MAHLZEIT WÄHLEN
        function selectMealType(type) {
            selectedMeal = type;
            document.querySelectorAll('.meal-type-btn').forEach(btn => {
                btn.classList.remove('border-emerald-500', 'bg-slate-800');
                btn.classList.add('bg-slate-900');
            });
            const activeBtn = document.getElementById(`btn-${type}`);
            if (activeBtn) {
                activeBtn.classList.add('border-emerald-500', 'bg-slate-800');
            }
        }

        // SUPABASE LOGGING
        async function logWater(type, amount) {
            if (!supabaseClient) return alert('Bitte zuerst Supabase konfigurieren!');
            const selectedDate = document.getElementById('selectedDate').value;
            const now = new Date();
            const timestamp = new Date(selectedDate + 'T' + now.toTimeString().split(' ')[0]);

            const { error } = await supabaseClient
                .from('water_logs')
                .insert([{ created_at: timestamp.toISOString(), type: type, amount_ml: amount }]);

            if (!error) loadDayData();
        }

        async function logFoodQuick(name, category) {
            if (!supabaseClient) return alert('Bitte zuerst Supabase konfigurieren!');
            const selectedDate = document.getElementById('selectedDate').value;
            const now = new Date();
            const timestamp = new Date(selectedDate + 'T' + now.toTimeString().split(' ')[0]);

            const { error } = await supabaseClient
                .from('food_logs')
                .insert([{ created_at: timestamp.toISOString(), meal_type: category, description: name }]);

            if (!error) loadDayData();
        }

        async function addFoodLog() {
            if (!supabaseClient) return alert('Bitte zuerst Supabase konfigurieren!');
            const desc = document.getElementById('foodDescription').value.trim();
            if (!desc) return;

            const selectedDate = document.getElementById('selectedDate').value;
            const now = new Date();
            const timestamp = new Date(selectedDate + 'T' + now.toTimeString().split(' ')[0]);

            const { error } = await supabaseClient
                .from('food_logs')
                .insert([{ created_at: timestamp.toISOString(), meal_type: selectedMeal, description: desc }]);

            if (!error) {
                document.getElementById('foodDescription').value = '';
                loadDayData();
            }
        }

        async function deleteLog(table, id) {
            if (!supabaseClient) return;
            const { error } = await supabaseClient.from(table).delete().eq('id', id);
            if (!error) loadDayData();
        }

        // DATEN LADEN
        async function loadDayData() {
            if (!supabaseClient) return;
            
            const selectedDate = document.getElementById('selectedDate').value;
            const startOfDay = new Date(selectedDate + 'T00:00:00').toISOString();
            const endOfDay = new Date(selectedDate + 'T23:59:59').toISOString();

            // Water Logs
            const { data: waterLogs } = await supabaseClient
                .from('water_logs')
                .select('*')
                .gte('created_at', startOfDay)
                .lte('created_at', endOfDay)
                .order('created_at', { ascending: true });

            // Food Logs
            const { data: foodLogs } = await supabaseClient
                .from('food_logs')
                .select('*')
                .gte('created_at', startOfDay)
                .lte('created_at', endOfDay)
                .order('created_at', { ascending: true });

            updateUI(waterLogs || [], foodLogs || []);
        }

        function updateUI(waterLogs, foodLogs) {
            // Stats
            const totalMl = waterLogs.reduce((sum, item) => sum + item.amount_ml, 0);
            document.getElementById('totalWater').textContent = totalMl;
            document.getElementById('totalMeals').textContent = foodLogs.length;

            // Log-Liste
            const logList = document.getElementById('logList');
            logList.innerHTML = '';

            const combined = [
                ...waterLogs.map(w => ({ ...w, _type: 'water' })),
                ...foodLogs.map(f => ({ ...f, _type: 'food' }))
            ].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

            if (combined.length === 0) {
                logList.innerHTML = '<div class="text-slate-500 text-center py-4">Noch keine Einträge für diesen Tag.</div>';
            } else {
                combined.forEach(item => {
                    const time = new Date(item.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const div = document.createElement('div');
                    div.className = 'flex items-center justify-between bg-slate-900 p-3 rounded-xl border border-slate-700/50';

                    if (item._type === 'water') {
                        div.innerHTML = `
                            <div class="flex items-center gap-3">
                                <i class="fa-solid fa-droplet text-cyan-400"></i>
                                <div>
                                    <div class="font-semibold text-slate-200">${item.type} (${item.amount_ml} ml)</div>
                                    <div class="text-[10px] text-slate-500">${time}</div>
                                </div>
                            </div>
                            <button onclick="deleteLog('water_logs', ${item.id})" class="text-slate-500 hover:text-red-400 p-1">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        `;
                    } else {
                        div.innerHTML = `
                            <div class="flex items-center gap-3">
                                <i class="fa-solid fa-utensils text-emerald-400"></i>
                                <div>
                                    <div class="font-semibold text-slate-200">${item.description}</div>
                                    <div class="text-[10px] text-slate-500 capitalize">${item.meal_type} • ${time}</div>
                                </div>
                            </div>
                            <button onclick="deleteLog('food_logs', ${item.id})" class="text-slate-500 hover:text-red-400 p-1">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        `;
                    }
                    logList.appendChild(div);
                });
            }

            updateChart(waterLogs);
        }

        // CHART JS
        function initChart() {
            const ctx = document.getElementById('waterChart').getContext('2d');
            waterChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Wasserverlauf (ml)',
                        data: [],
                        borderColor: '#22d3ee',
                        backgroundColor: 'rgba(34, 211, 238, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } }
                    }
                }
            });
        }

        function updateChart(waterLogs) {
            if (!waterChart) return;
            
            let accum = 0;
            const labels = [];
            const data = [];

            waterLogs.forEach(log => {
                const time = new Date(log.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                accum += log.amount_ml;
                labels.push(time);
                data.push(accum);
            });

            waterChart.data.labels = labels;
            waterChart.data.datasets[0].data = data;
            waterChart.update();
        }
    </script>
</body>
</html>
