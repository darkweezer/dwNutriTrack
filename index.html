<!-- Wasser Tracker Section -->
<section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2">
      <i class="fa-solid fa-droplet text-blue-500"></i> Wasser & Getränke
    </h2>
    <span id="water-today-total" class="text-sm font-semibold text-blue-600 bg-blue-50 px-2 py-1 rounded-md">0 ml</span>
  </div>

  <!-- Quick Water Buttons -->
  <div class="grid grid-cols-3 gap-2 mb-4">
    <button onclick="logWater(250, 'Wasser')" class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-medium py-2 px-3 rounded-xl border border-blue-200 text-sm flex flex-col items-center gap-1 transition">
      <i class="fa-solid fa-glass-water"></i> 250ml Wasser
    </button>
    <button onclick="logWater(500, 'Wasser')" class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-medium py-2 px-3 rounded-xl border border-blue-200 text-sm flex flex-col items-center gap-1 transition">
      <i class="fa-solid fa-bottle-water"></i> 500ml Wasser
    </button>
    <button onclick="logWater(200, 'Kaffee')" class="bg-amber-50 hover:bg-amber-100 text-amber-800 font-medium py-2 px-3 rounded-xl border border-amber-200 text-sm flex flex-col items-center gap-1 transition">
      <i class="fa-solid fa-mug-hot"></i> 200ml Kaffee
    </button>
  </div>

  <!-- Custom Water Input Form -->
  <form id="water-form" onsubmit="handleWaterSubmit(event)" class="flex gap-2">
    <input type="number" id="water-amount" placeholder="Menge in ml" required min="10" step="10" class="flex-1 px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    <select id="water-type" class="px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      <option value="Wasser">Wasser</option>
      <option value="Kaffee">Kaffee</option>
      <option value="Tee">Tee</option>
      <option value="Softdrink">Softdrink</option>
    </select>
    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-xl text-sm transition">
      +
    </button>
  </form>

  <!-- Today's Water Logs -->
  <div class="mt-4 border-t border-slate-100 pt-3">
    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Heute getrunken</h3>
    <ul id="water-logs-list" class="space-y-2 text-sm max-h-40 overflow-y-auto pr-1">
      <!-- Dynamische Einträge -->
    </ul>
  </div>
</section>

<!-- Food Tracker Section -->
<section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2">
      <i class="fa-solid fa-utensils text-emerald-500"></i> Mahlzeiten
    </h2>
  </div>

  <!-- Quick Food / Schnellerfassung Buttons -->
  <div class="mb-4">
    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Schnellerfassung</label>
    <div class="grid grid-cols-2 gap-2">
      <button onclick="logQuickFood('morgens', 'Haferflocken mit Beeren & Milch')" class="text-left bg-emerald-50 hover:bg-emerald-100 text-emerald-800 p-2 rounded-xl border border-emerald-200 text-xs font-medium transition flex items-center gap-2">
        <i class="fa-solid fa-bowl-rice text-emerald-600"></i> Haferflocken mit Beeren
      </button>
      <button onclick="logQuickFood('morgens', 'Kaffee & Vollkornbrötchen')" class="text-left bg-emerald-50 hover:bg-emerald-100 text-emerald-800 p-2 rounded-xl border border-emerald-200 text-xs font-medium transition flex items-center gap-2">
        <i class="fa-solid fa-bread-slice text-emerald-600"></i> Kaffee & Brötchen
      </button>
      <button onclick="logQuickFood('mittags', 'Gemischter Salat mit Hähnchen')" class="text-left bg-emerald-50 hover:bg-emerald-100 text-emerald-800 p-2 rounded-xl border border-emerald-200 text-xs font-medium transition flex items-center gap-2">
        <i class="fa-solid fa-carrot text-emerald-600"></i> Gemischter Salat
      </button>
      <button onclick="logQuickFood('snacks', 'Apfel & Eine Hand voll Nüsse')" class="text-left bg-emerald-50 hover:bg-emerald-100 text-emerald-800 p-2 rounded-xl border border-emerald-200 text-xs font-medium transition flex items-center gap-2">
        <i class="fa-solid fa-apple-whole text-emerald-600"></i> Apfel & Nüsse
      </button>
    </div>
  </div>

  <!-- Custom Food Input Form -->
  <form id="food-form" onsubmit="handleFoodSubmit(event)" class="space-y-3">
    <div class="flex gap-2">
      <select id="food-meal-type" class="px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <option value="morgens">Morgens</option>
        <option value="mittags">Mittags</option>
        <option value="abends">Abends</option>
        <option value="snacks">Snack</option>
      </select>
      <input type="text" id="food-description" placeholder="Was hast du gegessen?" required class="flex-1 px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
    </div>
    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-xl text-sm transition">
      Mahlzeit speichern
    </button>
  </form>

  <!-- Today's Food Logs -->
  <div class="mt-4 border-t border-slate-100 pt-3">
    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Heute gegessen</h3>
    <ul id="food-logs-list" class="space-y-2 text-sm max-h-56 overflow-y-auto pr-1">
      <!-- Dynamische Einträge -->
    </ul>
  </div>
</section>
